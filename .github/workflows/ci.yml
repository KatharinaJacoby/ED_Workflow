name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Sanity: list repo
        run: |
          pwd
          ls -la
          ls -la src || true

      - name: Sanity: import carefirst
        env:
          PYTHONPATH: src
        run: python -c "import sys; print(sys.version); import carefirst; print('OK:', carefirst.__name__)"

      - name: Run tests
        env:
          PYTHONPATH: src
        run: pytest -q
