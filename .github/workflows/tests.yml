- name: Preflight: show notebooks and NOTEBOOK_PATH
  run: |
    echo "NOTEBOOK_PATH=${NOTEBOOK_PATH:-<not set>}"
    echo "Repo notebooks:"
    git ls-files | grep -i '\.ipynb$' || true


name: tests
on:
  push:
    branches: [ Main_organized, main, master ]
  pull_request:
    branches: [ Main_organized, main, master ]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest nbformat
      - name: Run tests
        env:
          NOTEBOOK_PATH: notebooks/pipeline-ui-gate-mlp-catboost-spc.ipynb
        run: pytest -q
